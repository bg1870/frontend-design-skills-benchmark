<!--
Direction row: Dark instrument
One gesture: a continuous cyan schedule rail threading through every queued job
Density: dense operational tool, 8px rhythm and 40px minimum controls
Dominant element on first screen: the live job queue
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dispatcher job queue for a plumbing service team.">
  <meta name="theme-color" content="oklch(0.19 0.012 255)">
  <title>Flowline Dispatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --surface: oklch(0.19 0.012 255);
      --surface-raised: oklch(0.235 0.014 255);
      --surface-soft: oklch(0.27 0.012 255);
      --ink: oklch(0.95 0.005 255);
      --ink-muted: oklch(0.7 0.012 255);
      --line: oklch(0.95 0.005 255 / 0.09);
      --accent: oklch(0.75 0.17 190);
      --accent-soft: oklch(0.75 0.17 190 / 0.11);
      --warning: oklch(0.78 0.15 75);
      --danger: oklch(0.68 0.18 28);
      --font-text: "Inter Tight", "Arial Narrow", sans-serif;
      --font-mono: "IBM Plex Mono", Consolas, monospace;
      --text-xs: 0.694rem;
      --text-sm: 0.833rem;
      --text-base: 1rem;
      --text-md: 1.2rem;
      --text-lg: 1.44rem;
      --text-xl: 2.986rem;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --space-12: 48px;
      --space-16: 64px;
      --radius-sm: 6px;
      --radius-lg: 10px;
      --shadow-low: none;
      --shadow-high: none;
      --duration-fast: 160ms;
      --duration-slow: 380ms;
      --ease: cubic-bezier(0.2, 0, 0, 1);
      --control: 40px;
      --rail: 2px;
      --icon: 18px;
      --content: 1440px;
    }
    * { box-sizing: border-box; }
    html { background: var(--surface); }
    body { margin: 0; min-width: 320px; background: var(--surface); color: var(--ink); font: 400 var(--text-sm)/1.5 var(--font-text); -webkit-tap-highlight-color: var(--accent-soft); }
    button, input { touch-action: manipulation; }
    h1, h2 { text-wrap: balance; }
    .skip-link { position: fixed; z-index: 2; top: var(--space-2); left: var(--space-2); padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); background: var(--accent); color: var(--surface); translate: 0 -200%; }
    .skip-link:focus { translate: 0; }
    button, input { font: inherit; }
    button { color: inherit; }
    button, [type="search"] { min-height: var(--control); }
    button { cursor: pointer; }
    svg { width: var(--icon); height: var(--icon); flex: none; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .shell { max-width: var(--content); margin-inline: auto; padding-inline: var(--space-6); }
    .masthead { min-height: var(--space-16); display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: var(--space-3); font-weight: 700; font-size: var(--text-md); letter-spacing: -0.02em; }
    .brand-mark { width: var(--space-8); height: var(--space-8); display: grid; place-items: center; border-radius: var(--radius-sm); background: var(--accent); color: var(--surface); }
    .brand-mark svg { width: var(--space-6); height: var(--space-6); }
    .shift { display: flex; align-items: center; gap: var(--space-2); color: var(--ink-muted); font-family: var(--font-mono); font-size: var(--text-xs); font-variant-numeric: tabular-nums; }
    .live-dot { width: var(--space-2); height: var(--space-2); border-radius: 50%; background: var(--accent); }
    .summary-wrap { background: var(--surface-raised); border-bottom: 1px solid var(--line); }
    .summary { display: grid; grid-template-columns: minmax(220px, 1.5fr) repeat(4, minmax(110px, 0.55fr)); }
    .summary-intro, .metric { min-height: 112px; padding: var(--space-6); display: flex; flex-direction: column; justify-content: space-between; }
    .metric { border-left: 1px solid var(--line); }
    .kicker, .metric-label { color: var(--ink-muted); font-size: var(--text-xs); font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
    .summary h1 { margin: 0; font-size: var(--text-lg); line-height: 1.15; letter-spacing: -0.02em; }
    .sample { align-self: flex-start; font-family: var(--font-mono); font-size: var(--text-xs); color: var(--accent); }
    .metric-value { font: 500 var(--text-xl)/1 var(--font-mono); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
    main { padding-block: var(--space-8) var(--space-16); }
    .queue-head { display: flex; align-items: end; justify-content: space-between; gap: var(--space-6); margin-bottom: var(--space-6); }
    .queue-head h2 { margin: 0; font-size: var(--text-lg); letter-spacing: -0.02em; }
    .queue-head p { margin: var(--space-1) 0 0; color: var(--ink-muted); }
    .tools { display: flex; align-items: center; gap: var(--space-2); }
    .search { position: relative; }
    .search svg { position: absolute; left: var(--space-3); top: 50%; translate: 0 -50%; color: var(--ink-muted); pointer-events: none; }
    .search input { width: 240px; padding: 0 var(--space-3) 0 var(--space-12); border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-raised); color: var(--ink); }
    .search input::placeholder { color: var(--ink-muted); }
    .icon-button { width: var(--control); padding: 0; display: grid; place-items: center; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-raised); transition: color var(--duration-fast) var(--ease), background var(--duration-fast) var(--ease); }
    .icon-button:hover { background: var(--surface-soft); color: var(--accent); }
    .filters { display: flex; gap: var(--space-2); overflow-x: auto; margin-bottom: var(--space-4); padding-bottom: var(--space-1); }
    .filter { min-height: var(--space-8); padding: 0 var(--space-3); border: 1px solid var(--line); border-radius: var(--radius-sm); background: transparent; color: var(--ink-muted); font-size: var(--text-xs); font-weight: 600; }
    .filter:hover { color: var(--ink); background: var(--surface-soft); }
    .filter[aria-pressed="true"] { color: var(--surface); background: var(--accent); border-color: var(--accent); }
    .queue { position: relative; border-top: 1px solid var(--line); }
    .queue::before { content: ""; position: absolute; top: 0; bottom: 0; left: 139px; width: var(--rail); background: var(--accent); opacity: 0.45; }
    .job { position: relative; display: grid; grid-template-columns: 116px minmax(220px, 1.5fr) minmax(180px, 0.85fr) minmax(190px, 0.9fr) 110px; align-items: center; gap: var(--space-6); min-height: 88px; border-bottom: 1px solid var(--line); }
    .job-time { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .job-time strong { display: block; font-size: var(--text-base); font-weight: 500; }
    .job-time span, .job-id, .address { color: var(--ink-muted); font-size: var(--text-xs); }
    .rail-node { position: absolute; left: 132px; width: var(--space-4); height: var(--space-4); border: var(--space-1) solid var(--surface); border-radius: 50%; background: var(--accent); }
    .job-title { min-width: 0; }
    .job-title strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--text-base); font-weight: 600; }
    .job-id { font-family: var(--font-mono); }
    .address, .tech { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tech { display: flex; align-items: center; gap: var(--space-2); }
    .tech-mark { width: var(--space-8); height: var(--space-8); display: grid; place-items: center; flex: none; border-radius: 50%; background: var(--surface-soft); color: var(--ink-muted); font: 500 var(--text-xs)/1 var(--font-mono); }
    .unassigned { color: var(--warning); }
    .status { justify-self: end; padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm); font: 500 var(--text-xs)/1.5 var(--font-mono); text-transform: capitalize; }
    .status-open { background: color-mix(in oklch, var(--warning) 12%, transparent); color: var(--warning); }
    .status-assigned { background: var(--accent-soft); color: var(--accent); }
    .status-done { color: var(--ink-muted); }
    .state { min-height: 240px; display: grid; place-items: center; text-align: center; border-bottom: 1px solid var(--line); color: var(--ink-muted); }
    .state strong { display: block; margin-bottom: var(--space-2); color: var(--ink); font-size: var(--text-md); }
    .retry { margin-top: var(--space-4); padding-inline: var(--space-4); border: 1px solid var(--accent); border-radius: var(--radius-sm); background: transparent; color: var(--accent); }
    .retry:hover { background: var(--accent-soft); }
    .spinner { width: var(--space-6); height: var(--space-6); margin: 0 auto var(--space-3); border: var(--rail) solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin var(--duration-slow) linear infinite; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @keyframes spin { to { transform: rotate(1turn); } }
    @media (max-width: 900px) {
      .summary { grid-template-columns: repeat(4, 1fr); }
      .summary-intro { grid-column: 1 / -1; min-height: auto; flex-direction: row; align-items: center; gap: var(--space-4); }
      .metric { min-height: 96px; border-top: 1px solid var(--line); }
      .metric:first-of-type { border-left: 0; }
      .job { grid-template-columns: 100px minmax(180px, 1fr) minmax(150px, 0.7fr) 96px; }
      .queue::before { left: 123px; }
      .rail-node { left: 116px; }
      .address { display: none; }
    }
    @media (max-width: 640px) {
      .shell { padding-inline: var(--space-4); }
      .shift span:last-child { display: none; }
      .summary-wrap .shell { padding-inline: 0; }
      .summary { grid-template-columns: repeat(2, 1fr); }
      .summary-intro { padding-inline: var(--space-4); }
      .metric { min-height: 88px; padding: var(--space-4); }
      .metric:nth-of-type(3) { border-left: 0; }
      .metric-value { font-size: var(--text-lg); }
      .queue-head { align-items: stretch; flex-direction: column; gap: var(--space-4); }
      .tools, .search, .search input { width: 100%; }
      .job { grid-template-columns: 72px minmax(0, 1fr) auto; gap: var(--space-4); min-height: 96px; padding-block: var(--space-2); }
      .queue::before { left: 83px; }
      .rail-node { left: 76px; }
      .job-time strong { font-size: var(--text-sm); }
      .tech { grid-column: 2 / -1; grid-row: 2; }
      .status { grid-column: 3; grid-row: 1; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to job queue</a>
  <header>
    <div class="shell masthead">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 3v6a5 5 0 0 0 10 0V3M4 3h6M14 3h6M12 14v7"/></svg></span>
        Flowline Dispatch
      </div>
      <div class="shift"><span class="live-dot" aria-hidden="true"></span><span id="clock">Loading shift…</span></div>
    </div>
    <div class="summary-wrap">
      <div class="shell summary">
        <div class="summary-intro"><div><span class="kicker">Service board</span><h1>Job queue</h1></div><span class="sample" id="sample-label">Sample data</span></div>
        <div class="metric"><span class="metric-label">Total jobs</span><strong class="metric-value" id="total">—</strong></div>
        <div class="metric"><span class="metric-label">Open</span><strong class="metric-value" id="open">—</strong></div>
        <div class="metric"><span class="metric-label">Assigned</span><strong class="metric-value" id="assigned">—</strong></div>
        <div class="metric"><span class="metric-label">Completed</span><strong class="metric-value" id="done">—</strong></div>
      </div>
    </div>
  </header>
  <main class="shell" id="main-content">
    <div class="queue-head">
      <div><h2>Dispatch schedule</h2><p id="queue-caption">Jobs ordered by appointment time</p></div>
      <div class="tools">
        <label class="search"><span class="sr-only">Search jobs</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="search" name="job-search" type="search" placeholder="Search jobs…" autocomplete="off"></label>
        <button class="icon-button" id="refresh" type="button" aria-label="Refresh jobs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 8a7 7 0 0 1 11.7-2.2L20 8M4 16l2.2 2.2A7 7 0 0 0 17.9 16"/></svg></button>
      </div>
    </div>
    <div class="filters" aria-label="Filter jobs">
      <button class="filter" type="button" data-filter="all" aria-pressed="true">All</button>
      <button class="filter" type="button" data-filter="open" aria-pressed="false">Open</button>
      <button class="filter" type="button" data-filter="assigned" aria-pressed="false">Assigned</button>
      <button class="filter" type="button" data-filter="done" aria-pressed="false">Completed</button>
    </div>
    <section class="queue" id="queue" aria-live="polite" aria-busy="true">
      <div class="state"><div><div class="spinner" aria-hidden="true"></div>Loading job queue…</div></div>
    </section>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const allowedFilters = ['all', 'open', 'assigned', 'done'];
    const state = { jobs: [], filter: allowedFilters.includes(params.get('status')) ? params.get('status') : 'all', query: params.get('q') || '' };
    const queue = document.querySelector('#queue');
    const search = document.querySelector('#search');
    const dateTime = new Intl.DateTimeFormat('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    const day = new Intl.DateTimeFormat('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    const time = new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: '2-digit' });

    function initials(name) { return name ? name.split(/\s+/).map(part => part[0]).join('').replaceAll('.', '') : '—'; }
    function updateSummary() {
      const counts = state.jobs.reduce((sum, job) => ({ ...sum, [job.status]: (sum[job.status] || 0) + 1 }), {});
      document.querySelector('#total').textContent = state.jobs.length;
      ['open', 'assigned', 'done'].forEach(key => document.querySelector(`#${key}`).textContent = counts[key] || 0);
      document.querySelector('#sample-label').textContent = `Sample data · ${state.jobs.length} records`;
    }
    function syncUrl() {
      const next = new URLSearchParams();
      if (state.filter !== 'all') next.set('status', state.filter);
      if (state.query) next.set('q', state.query);
      history.replaceState(null, '', `${location.pathname}${next.size ? `?${next}` : ''}`);
    }
    function visibleJobs() {
      const q = state.query.toLowerCase();
      return state.jobs.filter(job => (state.filter === 'all' || job.status === state.filter) && [job.id, job.title, job.technician, job.address].some(value => value?.toLowerCase().includes(q)));
    }
    function render() {
      const jobs = visibleJobs();
      queue.setAttribute('aria-busy', 'false');
      document.querySelector('#queue-caption').textContent = `${jobs.length} ${jobs.length === 1 ? 'job' : 'jobs'} shown · ordered by appointment time`;
      if (!jobs.length) {
        queue.innerHTML = '<div class="state"><div><strong>No matching jobs</strong>Clear the search or choose another status.</div></div>';
        return;
      }
      queue.innerHTML = jobs.map(job => {
        const appointment = new Date(job.scheduled_at);
        const tech = job.technician || 'Needs technician';
        return `<article class="job">
          <time class="job-time" datetime="${job.scheduled_at}"><strong>${time.format(appointment)}</strong><span>${day.format(appointment)}</span></time>
          <span class="rail-node" aria-hidden="true"></span>
          <div class="job-title"><strong title="${job.title}">${job.title}</strong><span class="job-id">${job.id}</span></div>
          <div class="address" title="${job.address}">${job.address}</div>
          <div class="tech ${job.technician ? '' : 'unassigned'}"><span class="tech-mark" aria-hidden="true">${initials(job.technician)}</span><span>${tech}</span></div>
          <span class="status status-${job.status}">${job.status === 'done' ? 'Completed' : job.status}</span>
        </article>`;
      }).join('');
    }
    async function loadJobs() {
      queue.setAttribute('aria-busy', 'true');
      queue.innerHTML = '<div class="state"><div><div class="spinner" aria-hidden="true"></div>Loading job queue…</div></div>';
      try {
        const response = await fetch('fixtures/jobs.json', { cache: 'no-store' });
        if (!response.ok) throw new Error(`Request failed: ${response.status}`);
        state.jobs = (await response.json()).sort((a, b) => new Date(a.scheduled_at) - new Date(b.scheduled_at));
        updateSummary(); render();
      } catch (error) {
        queue.setAttribute('aria-busy', 'false');
        queue.innerHTML = '<div class="state"><div><strong>Jobs could not be loaded</strong>Check the data file and try again.<br><button class="retry" type="button">Try again</button></div></div>';
        queue.querySelector('.retry').addEventListener('click', loadJobs);
      }
    }
    document.querySelector('.filters').addEventListener('click', event => {
      const button = event.target.closest('[data-filter]');
      if (!button) return;
      state.filter = button.dataset.filter;
      document.querySelectorAll('[data-filter]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
      syncUrl(); render();
    });
    search.value = state.query;
    document.querySelectorAll('[data-filter]').forEach(item => item.setAttribute('aria-pressed', String(item.dataset.filter === state.filter)));
    search.addEventListener('input', () => { state.query = search.value.trim(); syncUrl(); render(); });
    document.querySelector('#refresh').addEventListener('click', loadJobs);
    function updateClock() { document.querySelector('#clock').textContent = `${dateTime.format(new Date())} · Dispatch active`; }
    updateClock(); setInterval(updateClock, 60000); loadJobs();
  </script>
</body>
</html>
