<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0C0E12">
  <title>Pipeboard — Dispatch</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%230C0E12'/%3E%3Cpath d='M9 7v9a7 7 0 0014 0V9M19 9h8M24 5v8' fill='none' stroke='%237EE787' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="Pipeboard dashboard">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 4v12a8 8 0 0 0 16 0V8M19 8h10M25 3v10"/></svg>
      <span>PIPEBOARD</span><small>/ DISPATCH</small>
    </a>
    <div class="shift"><span class="live-dot"></span>SHIFT LIVE <b>06:00–18:00</b></div>
    <button class="icon-button" id="themeButton" aria-label="Toggle contrast">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <main>
    <section class="summary" aria-labelledby="summary-title">
      <div class="summary-lead">
        <p class="eyebrow">MON · SEP 08 · CENTRAL</p>
        <h1 id="summary-title"><span id="activeCount">04</span> jobs<br><em>on the board</em></h1>
      </div>
      <div class="summary-stat urgent"><span>Unassigned</span><strong id="openCount">02</strong><small>needs coverage</small></div>
      <div class="summary-stat"><span>Assigned</span><strong id="assignedCount">02</strong><small>crew en route</small></div>
      <div class="summary-stat"><span>Completed</span><strong id="doneCount">02</strong><small>this cycle</small></div>
    </section>

    <section class="workspace">
      <div class="queue-head">
        <div>
          <p class="eyebrow">OPERATIONS / JOB QUEUE</p>
          <h2>Dispatch board</h2>
        </div>
        <div class="queue-actions">
          <label class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <span class="sr-only">Search jobs</span>
            <input id="search" type="search" placeholder="Search job, address, tech" autocomplete="off">
            <kbd>/</kbd>
          </label>
          <button class="add-button" id="newJob">+ NEW JOB</button>
        </div>
      </div>

      <div class="filters" role="group" aria-label="Filter jobs">
        <button class="filter active" data-filter="all">ALL <span>6</span></button>
        <button class="filter" data-filter="open">OPEN <span>2</span></button>
        <button class="filter" data-filter="assigned">ASSIGNED <span>2</span></button>
        <button class="filter" data-filter="done">DONE <span>2</span></button>
      </div>

      <div class="queue" id="queue" aria-live="polite"></div>
      <p class="empty" id="empty" hidden>No jobs match this view.</p>
    </section>
  </main>

  <dialog id="jobDialog">
    <button class="dialog-close" aria-label="Close dialog">×</button>
    <p class="eyebrow">JOB DETAIL</p>
    <h3 id="dialogTitle"></h3>
    <dl id="dialogDetails"></dl>
    <button class="add-button dialog-action">OPEN WORK ORDER</button>
  </dialog>

  <footer><span>PIPEBOARD OPS // 2026</span><span>6 RECORDS · FIXTURES/JOBS.JSON</span></footer>
  <script src="app.js"></script>
</body>
</html>
