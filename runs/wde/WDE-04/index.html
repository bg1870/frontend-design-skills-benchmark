<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FFF4E8" />
  <title>Daymark — Habit prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --neutral-raised:#FFFCF8;--neutral-ground:#FFF4E8;--neutral-border:#E4DDD2;--neutral-muted:#8A9994;--neutral-ink:#173B38;
      --accent-wash:#FDE1CF;--accent-main:#F5A06B;--accent-deep:#C76035;--status-wash:#DCE8D2;--status-ink:#365C3A;
      --color-canvas:var(--neutral-ground);--color-surface:var(--neutral-raised);--color-text:var(--neutral-ink);--color-muted:var(--neutral-muted);--color-border:var(--neutral-border);--color-action:var(--neutral-ink);
      --font-display:"Plus Jakarta Sans","Avenir Next",sans-serif;--font-mono:"DM Mono","IBM Plex Mono",monospace;
      --r-small:16px;--r-medium:24px;--r-large:32px;--shadow-phone:0 32px 80px rgba(23,59,56,.18);--shadow-sheet:0 -18px 44px rgba(23,59,56,.12);
      --ease:cubic-bezier(.22,.8,.3,1);--quick:180ms;--screen:320ms;--sheet:420ms;--bloom:520ms;--breathe:3200ms;
    }
    *{box-sizing:border-box}html,body,#root{min-height:100%;margin:0}body{background:#E4DDD2;color:var(--color-text);font-family:var(--font-display);display:grid;place-items:center;padding:24px;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{color:inherit}button:focus-visible,input:focus-visible{outline:2px solid var(--accent-deep);outline-offset:3px;box-shadow:0 0 0 5px var(--accent-wash)}
    .phone{width:390px;height:844px;background:var(--color-canvas);border:8px solid var(--neutral-ink);border-radius:46px;overflow:hidden;position:relative;box-shadow:var(--shadow-phone);isolation:isolate}.phone:before{content:"";position:absolute;z-index:30;top:10px;left:50%;translate:-50% 0;width:92px;height:25px;border-radius:20px;background:var(--neutral-ink)}
    .status{height:48px;padding:13px 25px 0;display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;font-weight:500;position:relative;z-index:2}.signal{display:flex;gap:6px;align-items:center}.signal i{display:block;width:14px;height:7px;border:1.5px solid var(--neutral-ink);border-radius:2px;position:relative}.signal i:after{content:"";position:absolute;inset:1px;width:8px;background:var(--neutral-ink);border-radius:1px}
    .app{height:100%;position:relative}.screen{position:absolute;inset:48px 0 76px;overflow:auto;padding:18px 24px 30px;scrollbar-width:none;animation:screenIn var(--screen) var(--ease)}.screen::-webkit-scrollbar{display:none}@keyframes screenIn{from{opacity:.2;transform:translateX(14px)}to{opacity:1;transform:none}}
    .topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.wordmark{font-size:15px;font-weight:800;letter-spacing:-.04em}.sample{font-size:10px;color:var(--color-muted);font-family:var(--font-mono)}.avatar{width:38px;height:38px;border:0;border-radius:50%;background:var(--accent-wash);font-weight:800;cursor:pointer;transition:transform var(--quick) var(--ease)}.avatar:hover{transform:translateY(-1px)}
    .date{font:500 12px var(--font-mono);color:var(--accent-deep);margin:0 0 8px}.hero{display:grid;grid-template-columns:1fr 94px;align-items:end;margin-bottom:23px}.hero h1{font-size:41px;line-height:.99;letter-spacing:-.055em;margin:0;font-weight:800}.progress-seal{width:86px;height:86px;border-radius:50%;background:var(--neutral-ink);color:var(--neutral-raised);display:grid;place-items:center;text-align:center;position:relative}.progress-seal:after{content:"";position:absolute;inset:-5px;border:1px solid var(--accent-main);border-radius:50%;animation:breathe var(--breathe) ease-in-out infinite}.progress-seal strong{font-size:23px;line-height:1}.progress-seal span{display:block;font:500 9px var(--font-mono);opacity:.72;margin-top:3px}@keyframes breathe{50%{transform:scale(1.045);opacity:.45}}
    .encouragement{margin:0 0 17px;color:var(--color-muted);font-size:13px}.habit-list{border-top:1px solid var(--color-border)}.habit-row{display:grid;grid-template-columns:54px 1fr 36px;gap:8px;align-items:center;min-height:79px;border-bottom:1px solid var(--color-border);transition:background var(--quick),opacity var(--quick);position:relative}.habit-row:hover{background:var(--color-surface)}.check{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--color-border);background:transparent;cursor:pointer;display:grid;place-items:center;transition:all var(--bloom) var(--ease)}.check svg{width:20px;opacity:0;transform:scale(.5);transition:all var(--bloom) var(--ease)}.habit-row.done .check{background:var(--accent-main);border-color:var(--accent-main);transform:rotate(-4deg)}.habit-row.done .check svg{opacity:1;transform:scale(1)}.habit-row.done .habit-name{text-decoration:line-through;text-decoration-color:var(--accent-deep);color:var(--color-muted)}.habit-name{font-size:15px;font-weight:700;margin-bottom:4px;transition:color var(--quick)}.habit-meta{font:500 10px var(--font-mono);color:var(--color-muted)}.detail-link{border:0;background:transparent;width:44px;height:44px;margin-left:-8px;border-radius:50%;cursor:pointer;font-size:22px;transition:transform var(--quick)}.detail-link:hover{transform:translateX(2px)}
    .bottom-nav{position:absolute;z-index:10;bottom:0;left:0;right:0;height:76px;background:rgba(255,252,248,.9);backdrop-filter:blur(14px);border-top:1px solid var(--color-border);display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;padding:0 28px 8px}.nav-btn{height:48px;border:0;background:transparent;border-radius:18px;font-size:11px;font-weight:700;color:var(--color-muted);cursor:pointer;display:flex;gap:7px;align-items:center;justify-content:center}.nav-btn.active{color:var(--color-text)}.add{width:56px;height:56px;border-radius:50%;border:0;background:var(--color-action);color:var(--neutral-raised);font-size:30px;line-height:1;cursor:pointer;box-shadow:0 8px 24px rgba(23,59,56,.2);transition:transform var(--quick)}.add:hover{transform:translateY(-2px)}.add:active{transform:scale(.98)}
    .back{width:44px;height:44px;border:1px solid var(--color-border);background:transparent;border-radius:50%;font-size:22px;cursor:pointer}.detail-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.detail-head span{font-size:12px;font-weight:700}.streak-intro{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:25px}.streak-intro h1{font-size:37px;line-height:1;letter-spacing:-.05em;margin:0}.streak-number{text-align:right}.streak-number strong{display:block;font:500 42px/1 var(--font-mono);color:var(--accent-deep)}.streak-number span{font-size:11px;color:var(--color-muted)}.calendar{background:var(--neutral-raised);border-radius:var(--r-large);padding:19px 18px 16px;margin-bottom:20px}.cal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px;font-weight:800}.cal-top span:last-child{font:500 10px var(--font-mono);color:var(--color-muted)}.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.weekdays span{text-align:center;font:500 9px var(--font-mono);color:var(--color-muted)}.day{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font:500 10px var(--font-mono);color:var(--color-muted)}.day.hit{background:var(--status-wash);color:var(--status-ink)}.day.today{outline:2px solid var(--accent-main);outline-offset:2px;color:var(--color-text)}.day.blank{visibility:hidden}.insight{display:grid;grid-template-columns:44px 1fr;gap:13px;padding:4px 2px 18px;border-bottom:1px solid var(--color-border)}.insight-mark{width:44px;height:44px;border-radius:var(--r-small);background:var(--accent-wash);display:grid;place-items:center;font:500 16px var(--font-mono)}.insight strong{display:block;font-size:14px;margin-bottom:4px}.insight p{margin:0;color:var(--color-muted);font-size:12px;line-height:1.5}.section-title{font-size:12px;margin:18px 0 8px}.history-line{height:38px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--color-border);font-size:12px}.history-line span:last-child{font-family:var(--font-mono);color:var(--status-ink)}
    .backdrop{position:absolute;inset:0;z-index:40;background:rgba(23,59,56,.28);backdrop-filter:blur(2px);animation:fade var(--sheet) var(--ease)}@keyframes fade{from{opacity:0}to{opacity:1}}.sheet{position:absolute;z-index:41;left:0;right:0;bottom:0;background:var(--neutral-ground);border-radius:32px 32px 0 0;padding:12px 24px 28px;box-shadow:var(--shadow-sheet);animation:sheetUp var(--sheet) var(--ease)}@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}.grabber{width:42px;height:4px;background:var(--neutral-border);border-radius:4px;margin:0 auto 20px}.sheet-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:24px}.sheet h2{font-size:30px;letter-spacing:-.045em;margin:0}.close{width:44px;height:44px;border:1px solid var(--color-border);background:transparent;border-radius:50%;font-size:22px;cursor:pointer}.field label,.frequency-label{display:block;font:500 10px var(--font-mono);color:var(--color-muted);margin-bottom:8px}.field input{width:100%;height:58px;border:1px solid var(--color-border);border-radius:var(--r-small);background:var(--neutral-raised);padding:0 16px;color:var(--color-text);font-size:16px}.field input::placeholder{color:var(--neutral-muted)}.error{min-height:23px;padding-top:5px;color:var(--accent-deep);font-size:11px}.frequency-label{margin-top:8px}.chips{display:flex;gap:8px;margin-bottom:26px}.chip{min-height:44px;padding:0 14px;border:1px solid var(--color-border);background:transparent;border-radius:22px;font-size:12px;font-weight:700;cursor:pointer}.chip.selected{background:var(--accent-wash);border-color:var(--accent-main)}.save{height:56px;width:100%;border:0;border-radius:28px;background:var(--color-action);color:var(--neutral-raised);font-weight:800;cursor:pointer;transition:transform var(--quick),opacity var(--quick)}.save:hover{transform:translateY(-1px)}.save:active{transform:scale(.98)}.save:disabled{opacity:.42;cursor:not-allowed}.tiny-note{text-align:center;color:var(--color-muted);font-size:10px;margin:11px 0 0}
    .tweaks-toggle{position:fixed;right:18px;bottom:18px;width:46px;height:46px;border-radius:50%;border:0;background:var(--neutral-ink);color:var(--neutral-raised);font-family:var(--font-mono);cursor:pointer;box-shadow:var(--shadow-phone)}.tweaks{position:fixed;right:18px;bottom:74px;width:224px;background:var(--neutral-ink);color:var(--neutral-raised);padding:16px;border-radius:var(--r-small);box-shadow:var(--shadow-phone);font-size:12px}.tweaks strong{display:block;margin-bottom:12px}.tweaks label{display:block;margin-top:10px;color:var(--neutral-border)}.tweaks select{width:100%;height:36px;margin-top:5px;border:1px solid var(--neutral-muted);border-radius:8px;background:var(--neutral-ink);color:var(--neutral-raised);padding:0 8px}.phone.compact .habit-row{min-height:67px}.phone.compact .hero{margin-bottom:14px}.phone.soft .habit-row{border-bottom-color:transparent;margin-bottom:7px;padding:0 8px;border-radius:var(--r-medium);background:var(--neutral-raised)}
    @media(max-width:460px){body{padding:0;background:var(--color-canvas)}.phone{width:100vw;height:100dvh;border:0;border-radius:0;box-shadow:none}.tweaks-toggle{right:10px;bottom:86px;z-index:35;width:40px;height:40px}.tweaks{right:10px;bottom:134px;z-index:50}.phone:before{top:8px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:1ms!important;transition-duration:1ms!important;animation-iteration-count:1!important}}
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" integrity="sha384-tMH8h3BGESGckSAVGZ82T9n90ztNXxvdwvdM6UoR56cYcf+0iGXBliJ29D+wZ/x8" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" integrity="sha384-bm7MnzvK++ykSwVJ2tynSE5TRdN+xL418osEVF2DE/L/gfWHj91J2Sphe582B1Bh" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js" integrity="sha384-AISI5AuDG6E8DeEiFMVB3rGQxhZt24OU0avMp+GMV64+tpnA3+Z6F5MT0f96iPva" crossorigin="anonymous"></script>
<script type="text/babel">
const CLOCK = new Date('2026-09-08T01:52:34+03:00');
const seedHabits = [
  {id:1,name:'Drink a glass of water',time:'Morning',done:true},
  {id:2,name:'Read for 20 minutes',time:'Anytime',done:true},
  {id:3,name:'Stretch & reset',time:'Afternoon',done:false},
  {id:4,name:'Walk outside',time:'Before sunset',done:true},
  {id:5,name:'Write one good thing',time:'Evening',done:false}
];
const historyPattern = [true,true,true,false,true,true,true,true,true,true,true,true,true,true,true,true,true,true,true,true,true,true,true,true,true,true,true,true];
const IconCheck=()=> <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 12.5 3.4 3.4L18.5 7.8" stroke="#173B38" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>;
function App(){
  const [habits,setHabits]=React.useState(seedHabits); const [view,setView]=React.useState('today'); const [sheet,setSheet]=React.useState(false); const [name,setName]=React.useState(''); const [frequency,setFrequency]=React.useState('Daily'); const [error,setError]=React.useState(''); const [saving,setSaving]=React.useState(false); const [tweaks,setTweaks]=React.useState(false); const [variant,setVariant]=React.useState('rail');
  React.useEffect(()=>{const onKey=e=>{if(e.key==='Escape')setSheet(false)};addEventListener('keydown',onKey);return()=>removeEventListener('keydown',onKey)},[]);
  const completed=habits.filter(h=>h.done).length; const dateLabel=new Intl.DateTimeFormat('en',{weekday:'long',month:'long',day:'numeric'}).format(CLOCK); const timeLabel=new Intl.DateTimeFormat('en',{hour:'numeric',minute:'2-digit',hour12:false}).format(CLOCK);
  function toggle(id){setHabits(habits.map(h=>h.id===id?{...h,done:!h.done}:h))}
  function addHabit(e){e.preventDefault();if(!name.trim()){setError('Give your habit a name');return}setSaving(true);setTimeout(()=>{setHabits([...habits,{id:Date.now(),name:name.trim(),time:frequency,done:false}]);setSaving(false);setSheet(false);setName('');setError('');setView('today')},420)}
  return <><div className={`phone ${variant}`}><div className="status"><span>{timeLabel}</span><span className="signal">5G <i/></span></div><div className="app">{view==='today'?<Today habits={habits} completed={completed} dateLabel={dateLabel} toggle={toggle} openDetail={()=>setView('detail')}/>:<Detail goBack={()=>setView('today')}/>}<nav className="bottom-nav" aria-label="Primary"><button className={`nav-btn ${view==='today'?'active':''}`} onClick={()=>setView('today')}>Today</button><button className="add" aria-label="Add habit" onClick={()=>setSheet(true)}>+</button><button className={`nav-btn ${view==='detail'?'active':''}`} onClick={()=>setView('detail')}>Progress</button></nav>{sheet&&<AddSheet name={name} setName={setName} frequency={frequency} setFrequency={setFrequency} error={error} setError={setError} saving={saving} close={()=>setSheet(false)} submit={addHabit}/>}</div></div><button className="tweaks-toggle" aria-label="Open Tweaks" onClick={()=>setTweaks(!tweaks)}>T</button>{tweaks&&<aside className="tweaks"><strong>Tweaks</strong><label>Habit list style<select value={variant} onChange={e=>setVariant(e.target.value)}><option value="rail">Day rail</option><option value="compact">Compact</option><option value="soft">Soft blocks</option></select></label></aside>}</>
}
function Today({habits,completed,dateLabel,toggle,openDetail}){return <main className="screen"><div className="topline"><div><div className="wordmark">daymark</div><div className="sample">Prototype · sample routine</div></div><button className="avatar" aria-label="Profile">A</button></div><p className="date">{dateLabel}</p><section className="hero"><h1>Small steps,<br/>well kept.</h1><div className="progress-seal"><div><strong>{completed}/{habits.length}</strong><span>marked today</span></div></div></section><p className="encouragement">{completed===habits.length?'You kept every promise today.':completed===0?'Begin wherever feels lightest.':`Keep the pace gentle — ${habits.length-completed} left.`}</p><div className="habit-list">{habits.map(h=><article className={`habit-row ${h.done?'done':''}`} key={h.id}><button className="check" aria-label={`${h.done?'Unmark':'Mark'} ${h.name}`} onClick={()=>toggle(h.id)}><IconCheck/></button><div><div className="habit-name">{h.name}</div><div className="habit-meta">{h.time}</div></div><button className="detail-link" aria-label={`View streak for ${h.name}`} onClick={openDetail}>›</button></article>)}</div></main>}
function Detail({goBack}){const year=CLOCK.getFullYear(),month=CLOCK.getMonth(),today=CLOCK.getDate(),first=new Date(year,month,1).getDay(),daysInMonth=new Date(year,month+1,0).getDate();const cells=[...Array(first).fill(null),...Array.from({length:daysInMonth},(_,i)=>i+1)];const streak=historyPattern.slice().reverse().findIndex(v=>!v);const currentStreak=streak===-1?historyPattern.length:streak;const completedDays=historyPattern.filter(Boolean).length;return <main className="screen"><header className="detail-head"><button className="back" onClick={goBack} aria-label="Back to today">‹</button><span>Read for 20 minutes</span><span aria-hidden="true">···</span></header><section className="streak-intro"><h1>Your rhythm<br/>is taking root.</h1><div className="streak-number"><strong>{currentStreak}</strong><span>day streak</span></div></section><section className="calendar"><div className="cal-top"><span>{new Intl.DateTimeFormat('en',{month:'long'}).format(CLOCK)}</span><span>{completedDays}/{historyPattern.length} marked</span></div><div className="weekdays">{'SMTWTFS'.split('').map((d,i)=><span key={i}>{d}</span>)}</div><div className="days">{cells.map((d,i)=><span key={i} className={`day ${d===null?'blank':''} ${d&&historyPattern[(d-1)%historyPattern.length]?'hit':''} ${d===today?'today':''}`}>{d||0}</span>)}</div></section><section className="insight"><div className="insight-mark">↗</div><div><strong>Evenings are working.</strong><p>Your recent marks form a steady run. Keep the cue where you already see it.</p></div></section><h2 className="section-title">Recent marks</h2>{Array.from({length:3},(_,i)=>{const d=new Date(CLOCK);d.setDate(today-i);return <div className="history-line" key={i}><span>{new Intl.DateTimeFormat('en',{weekday:'long',month:'short',day:'numeric'}).format(d)}</span><span>marked</span></div>})}</main>}
function AddSheet({name,setName,frequency,setFrequency,error,setError,saving,close,submit}){return <><div className="backdrop" onClick={close}/><section className="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div className="grabber"/><div className="sheet-head"><div><h2 id="sheet-title">Plant a habit</h2><p className="encouragement">Make it small enough to begin today.</p></div><button className="close" onClick={close} aria-label="Close">×</button></div><form onSubmit={submit}><div className="field"><label htmlFor="habit-name">HABIT NAME</label><input autoFocus id="habit-name" value={name} onChange={e=>{setName(e.target.value);setError('')}} placeholder="e.g. Put vitamins by the kettle" aria-invalid={!!error}/><div className="error" role="alert">{error}</div></div><span className="frequency-label">RHYTHM</span><div className="chips">{['Daily','Weekdays','3× weekly'].map(f=><button type="button" key={f} className={`chip ${frequency===f?'selected':''}`} onClick={()=>setFrequency(f)}>{f}</button>)}</div><button className="save" disabled={saving}>{saving?'Saving…':'Add to today'}</button><p className="tiny-note">You can change the rhythm later.</p></form></section></>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
