<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PipeLine Dispatch — Job Queue</title>
<style>
:root{--porcelain-000:#FFFFFF;--porcelain-050:#F4F6F4;--porcelain-100:#E9EDEB;--porcelain-200:#D4DBD7;--ink-500:#66716C;--ink-700:#394540;--ink-950:#13221C;--copper-100:#F4DED5;--copper-700:#9B3D1F;--workwear-100:#DCE7EC;--workwear-700:#294E62;--verified-100:#DCE9DF;--verified-700:#356344;--ground:var(--porcelain-050);--raised:var(--porcelain-000);--hover:var(--porcelain-100);--border:var(--porcelain-200);--muted:var(--ink-500);--body:var(--ink-700);--strong:var(--ink-950);--action:var(--copper-700);--display:Georgia,"Times New Roman",serif;--utility:"IBM Plex Mono","Liberation Mono",monospace;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:48px;--fast:120ms}
*{box-sizing:border-box}html{background:var(--ground);color:var(--strong);font-family:var(--display)}body{margin:0;min-width:320px}button,input,select{font:inherit;color:inherit}button{cursor:pointer}.utility,.eyebrow,.status,.meta,.column-head,.date-key{font-family:var(--utility);text-transform:uppercase;letter-spacing:.04em}.shell{max-width:1600px;margin:auto;padding:0 var(--s5) var(--s5)}
.masthead{height:84px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--strong)}.brand{display:flex;align-items:center;gap:var(--s4)}.logo-pending{border:1px dashed var(--ink-500);padding:8px 10px;font:10px var(--utility);letter-spacing:.04em;color:var(--muted)}.brand h1{font-size:24px;line-height:1;margin:0;letter-spacing:-.035em}.brand p,.stamp{margin:5px 0 0;color:var(--muted);font-size:11px}.date-lock{text-align:right}
.summary{display:grid;grid-template-columns:1.5fr repeat(4,1fr);border-bottom:1px solid var(--strong)}.summary-cell{min-width:145px;padding:16px 18px 18px;border-right:1px solid var(--border)}.summary-cell:first-child{padding-left:0}.summary-cell:last-child{border-right:0}.summary-label{font:10px var(--utility);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.summary-value{display:block;margin-top:6px;font-size:30px;line-height:1}.summary-value.open{color:var(--action)}.summary-note{font-size:12px;color:var(--muted);margin-top:6px}
.workspace{display:grid;grid-template-columns:184px minmax(0,1fr);gap:24px;padding-top:24px}.rail h2,.queue-title .eyebrow{font:10px var(--utility);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}.day-list{border-top:1px solid var(--strong)}.day-button{width:100%;min-height:64px;border:0;border-bottom:1px solid var(--border);background:transparent;text-align:left;padding:10px 8px;display:grid;grid-template-columns:1fr auto;align-items:center}.day-button:hover{background:var(--hover)}.day-button[aria-pressed="true"]{background:var(--copper-100);color:var(--action)}.day-button:focus-visible,.row:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--action);outline-offset:2px}.day-main{font-size:17px}.day-sub{font:10px var(--utility);color:var(--muted);margin-top:3px}.day-count{font:11px var(--utility)}
.queue-head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:16px}.queue-title h2{font-size:36px;line-height:.95;letter-spacing:-.035em;margin:0}.queue-title p{margin:9px 0 0;color:var(--muted);font-size:13px}.tools{display:flex;gap:8px}.search{height:44px;width:min(280px,32vw);border:1px solid var(--border);background:var(--raised);padding:0 12px}.filter{height:44px;border:1px solid var(--border);background:var(--raised);padding:0 34px 0 12px;font-size:13px}.button{min-height:44px;border:1px solid var(--strong);background:transparent;padding:0 14px;font:11px var(--utility);text-transform:uppercase;letter-spacing:.04em}.button:hover{background:var(--hover)}.button:active{transform:translateY(1px)}.button.primary{background:var(--action);color:var(--porcelain-000);border-color:var(--action)}.button.primary:hover{background:var(--ink-950)}
.ledger{border-top:1px solid var(--strong)}.ledger-grid{display:grid;grid-template-columns:92px minmax(210px,1.5fr) minmax(170px,1fr) minmax(190px,1.2fr) 126px 64px;align-items:center;column-gap:12px}.column-head{min-height:38px;font-size:9px;color:var(--muted);border-bottom:1px solid var(--border)}.row{min-height:76px;border-bottom:1px solid var(--border);transition:background var(--fast) linear}.row:hover{background:var(--hover)}.job-id{font:11px var(--utility);color:var(--muted)}.job-title{font-weight:700;font-size:16px}.address,.tech{font-size:13px;color:var(--body)}.time strong{font-size:16px;font-weight:400}.time span{display:block;font:9px var(--utility);color:var(--muted);margin-top:3px}.status{justify-self:start;padding:5px 7px;font-size:9px;font-weight:600}.status-open{background:var(--copper-100);color:var(--copper-700)}.status-assigned{background:var(--workwear-100);color:var(--workwear-700)}.status-done{background:var(--verified-100);color:var(--verified-700)}.more{width:44px;height:44px;border:0;background:transparent;font-size:20px}.more:hover{background:var(--raised)}.empty,.error,.loading{padding:48px 16px;border-bottom:1px solid var(--border);text-align:center;color:var(--muted)}.error{color:var(--action)}
.dialog{width:min(520px,calc(100% - 32px));border:1px solid var(--strong);border-radius:0;padding:0;background:var(--ground);color:var(--strong)}.dialog::backdrop{background:color-mix(in srgb,var(--ink-950) 54%,transparent)}.dialog-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}.dialog-head h3{font-size:24px;margin:0}.close{border:0;background:none;font:20px var(--utility)}.dialog-body{padding:24px}.detail-list{display:grid;grid-template-columns:110px 1fr;gap:12px;margin:0}.detail-list dt{font:9px var(--utility);text-transform:uppercase;color:var(--muted)}.detail-list dd{margin:0}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px;padding-top:16px;border-top:1px solid var(--border)}.assign-select{width:100%;height:44px;background:var(--raised);border:1px solid var(--border);padding:0 10px}.session-note{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-width:900px){.workspace{grid-template-columns:1fr}.day-list{display:flex;overflow:auto}.day-button{min-width:150px;border-right:1px solid var(--border)}.queue-head{align-items:flex-start}.ledger-grid{grid-template-columns:72px minmax(190px,1.4fr) minmax(140px,1fr) 120px 56px}.column-head>:nth-child(4),.row>:nth-child(4){display:none}.summary{overflow:auto}}
@media(max-width:640px){.shell{padding:0 16px 16px}.masthead{height:auto;padding:16px 0;align-items:flex-start}.brand h1{font-size:20px}.logo-pending{display:none}.date-lock{max-width:130px}.summary{margin:0 -16px;padding-left:16px}.summary-cell{padding:14px 12px}.queue-head{display:block}.queue-title h2{font-size:30px}.tools{margin-top:16px;display:grid;grid-template-columns:1fr 1fr}.search{width:100%;grid-column:1/-1}.ledger .column-head{display:none}.ledger{border-top:1px solid var(--strong)}.row.ledger-grid{display:grid;grid-template-columns:1fr auto;gap:8px 14px;padding:14px 0}.row>*{display:block!important}.row .job-id{grid-column:1}.row .time{grid-column:2;grid-row:1/3;text-align:right}.row .job-title{grid-column:1}.row .address,.row .tech{grid-column:1}.row .status{grid-column:1}.row .more{grid-column:2;grid-row:4/6;align-self:end}.summary-value{font-size:26px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="shell">
<header class="masthead"><div class="brand"><div class="logo-pending">[company logo pending]</div><div><h1>PipeLine Dispatch</h1><p class="utility">Field service ledger</p></div></div><div class="date-lock"><div id="today" class="utility">—</div><p class="stamp">Demo workspace · sample jobs, fixed clock</p></div></header>
<section id="summary" class="summary" aria-label="Job summary"></section>
<div class="workspace"><aside class="rail"><h2>Schedule</h2><nav id="days" class="day-list" aria-label="Filter by scheduled day"></nav></aside><section class="queue" aria-labelledby="queue-heading"><div class="queue-head"><div class="queue-title"><div class="eyebrow">Live queue</div><h2 id="queue-heading">Service calls</h2><p id="queue-caption" aria-live="polite">Reading job ledger…</p></div><div class="tools"><input id="search" class="search" type="search" placeholder="Search job, address, tech" aria-label="Search jobs"><select id="statusFilter" class="filter" aria-label="Filter status"><option value="all">All statuses</option><option value="open">Open</option><option value="assigned">Assigned</option><option value="done">Done</option></select></div></div><div id="ledger" class="ledger" aria-live="polite"><div class="loading">Reading job ledger…</div></div></section></div>
</main>
<dialog id="jobDialog" class="dialog"><div class="dialog-head"><h3 id="dialogTitle">Job detail</h3><button class="close" type="button" aria-label="Close">×</button></div><div id="dialogBody" class="dialog-body"></div></dialog>
<noscript><section class="shell"><h2>Job queue requires JavaScript</h2><p>The dispatcher shell is available, but the queue is loaded directly from <code>fixtures/jobs.json</code>. Enable JavaScript to read and filter sample jobs.</p></section></noscript>
<script src="app.js"></script>
</body>
</html>
